<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Contact page wireframe</title><desc id="desc">Contact page with short invitation, email and social links, and a future contact form.</desc>
  <rect width="900" height="650" fill="#f4f1ec"/><text x="40" y="48" font-family="Arial" font-size="24" font-weight="700" fill="#20201f">CONTACT — STRUCTURE SKETCH</text><rect x="40" y="75" width="820" height="535" rx="18" fill="#17191d"/><text x="70" y="110" fill="#e8e4df" font-family="Arial" font-size="16">LC / LEGION CUNNINGHAM</text><text x="650" y="110" fill="#aaa" font-family="Arial" font-size="14">About · Projects · Contact</text>
  <text x="90" y="190" fill="#d7a878" font-family="Arial" font-size="14">GET IN TOUCH</text><text x="90" y="240" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Have a project in mind?</text><text x="90" y="275" fill="#b7b0a7" font-family="Arial" font-size="15">I’m open to opportunities and conversations about building for the web.</text><rect x="90" y="315" width="330" height="225" rx="12" fill="#25282e" stroke="#44474d"/><text x="115" y="355" fill="#d7a878" font-family="Arial" font-size="14">CONTACT DETAILS</text><text x="115" y="393" fill="#fff" font-family="Arial" font-size="15">Email: add address</text><text x="115" y="426" fill="#fff" font-family="Arial" font-size="15">GitHub: add profile</text><text x="115" y="459" fill="#fff" font-family="Arial" font-size="15">LinkedIn: add profile</text><rect x="450" y="315" width="360" height="225" rx="12" fill="#25282e" stroke="#44474d"/><text x="475" y="355" fill="#d7a878" font-family="Arial" font-size="14">CONTACT FORM (LATER MILESTONE)</text><rect x="475" y="375" width="310" height="34" rx="5" fill="#17191d" stroke="#555"/><text x="488" y="398" fill="#888" font-family="Arial" font-size="12">Name</text><rect x="475" y="420" width="310" height="34" rx="5" fill="#17191d" stroke="#555"/><text x="488" y="443" fill="#888" font-family="Arial" font-size="12">Email</text><rect x="475" y="465" width="310" height="45" rx="5" fill="#17191d" stroke="#555"/><text x="488" y="488" fill="#888" font-family="Arial" font-size="12">Message</text><text x="90" y="580" fill="#888" font-family="Arial" font-size="12">Footer: availability note · social links</text><text x="40" y="635" fill="#555" font-family="Arial" font-size="13">Mobile: details first, then form; inputs use clear labels and focus states.</text>
</svg>
